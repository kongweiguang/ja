# @author kongweiguang

[package]
name = "ja"
version = "0.1.0"
description = "JA Coding Harness Agent desktop application"
authors = ["kongweiguang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/kongweiguang/ja"
readme = "../README.md"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Integration tests may inject a trusted Java25 fixture without making the
# executable/path constructor part of the production command surface.
test-support = []
# Tauri MockRuntime is opt-in because Windows test hosts may not provide the
# native API set needed by the mock builder's transitive runtime.
tauri-smoke = ["tauri/test", "test-support"]

[build-dependencies]
# Pin the build tool with the runtime so generated context code is reproducible.
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Keep the desktop host on the Tauri 2 line while leaving platform-specific
# functionality behind explicit plugins and capabilities.
# Keep the production Wry runtime while omitting the v6 common-controls
# linker import; Windows' test host may only expose comctl32 v5 without an
# application manifest, while native bundle manifests provide the v6 theme.
tauri = { version = "=2.11.5", default-features = false, features = [
    "wry",
    "compression",
    "dynamic-acl",
] }

# Wire format and stable error/identity primitives are shared by future IPC
# adapters; exact pins keep the native host reproducible across machines.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
uuid = { version = "=1.24.1", features = ["serde", "v4"] }
url = { version = "=2.5.8", features = ["serde"] }
sha2 = "=0.11.0"
base64 = "=0.22.1"

# Tokio owns bounded asynchronous child-process and JSONL I/O once the
# sidecar adapter is introduced; codec stays separate from the protocol model.
bytes = "=1.12.1"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec", "io-util"] }
# Keep PTY ownership in a mature cross-platform implementation so terminal
# sessions share ConPTY on Windows and Unix PTYs on macOS without custom FFI.
portable-pty = { version = "=0.9.0", default-features = false }

# Enforce one desktop instance without enabling deep-link integration, which
# is outside the preview release scope and would widen the capability surface.
tauri-plugin-single-instance = { version = "=2.4.3", default-features = false }
# Reuse Tauri's maintained native file chooser; capability policy below exposes
# only opening so future save/message surfaces cannot appear accidentally.
tauri-plugin-dialog = { version = "=2.7.2", default-features = false }
# Persist provider credentials in the native Apple/Windows stores; the 3.x
# feature names avoid keyring's Linux secret-service backends entirely.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

# Tracing is sent to stderr/files by the host and never to stdout, because
# stdout is reserved for the full-duplex JSONL protocol.
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[[test]]
name = "int_foundation_host"
path = "tests/int_foundation_host.rs"
required-features = ["test-support"]

[profile.release]
# Abort avoids shipping unwind metadata across the Tauri/sidecar boundary.
panic = "abort"
# Thin LTO retains acceptable build times while removing duplicate host code.
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = "symbols"
