name: macOS sandbox spike

on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/sandbox/macos/**"
      - ".github/workflows/spike-sandbox-macos.yml"

permissions:
  contents: read

jobs:
  native-seatbelt:
    name: Seatbelt ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare private evidence root
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          private_root="$RUNNER_TEMP/ja-sandbox-private"
          if [[ -e "$private_root" ]]; then
            [[ -d "$private_root" ]]
          else
            mkdir -m 700 "$private_root"
          fi
          [[ "$(stat -f '%Lp' "$private_root")" == "700" ]]
          report_dir="$RUNNER_TEMP/ja-sandbox-report"
          if [[ -e "$report_dir" ]]; then
            [[ -d "$report_dir" ]]
          else
            mkdir -m 700 "$report_dir"
          fi
          [[ "$(stat -f '%Lp' "$report_dir")" == "700" ]]
          printf 'JA_SANDBOX_PRIVATE_ROOT=%s\n' "$private_root" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        timeout-minutes: 3
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Format gate
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cargo +1.88.0 metadata --manifest-path spikes/sandbox/macos/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          # cargo fmt has no --locked option; the locked metadata check above
          # verifies the manifest/lock contract before rustfmt runs.
          cargo +1.88.0 fmt --all --manifest-path spikes/sandbox/macos/Cargo.toml -- --check
          for source in \
            spikes/sandbox/macos/src/bin/probe.rs \
            spikes/sandbox/macos/src/bin/probe_unit_tests/mod.rs \
            spikes/sandbox/macos/src/bin/probe_lifecycle/mod.rs \
            spikes/sandbox/macos/src/bin/native/mod.rs \
            spikes/sandbox/macos/src/bin/native/setup.rs \
            spikes/sandbox/macos/src/bin/native/probes.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/mod.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/capture.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/evidence.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/lifecycle.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/marker.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/query.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/redaction.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/tests.rs \
            spikes/sandbox/macos/src/bin/worker.rs \
            spikes/sandbox/macos/src/bin/marker_cleanup.rs \
            spikes/sandbox/macos/src/lib.rs \
            spikes/sandbox/macos/src/macos.rs \
            spikes/sandbox/macos/src/process.rs \
            spikes/sandbox/macos/src/marker_cleanup/mod.rs \
            spikes/sandbox/macos/src/marker_cleanup/fd.rs \
            spikes/sandbox/macos/src/marker_cleanup/marker.rs \
            spikes/sandbox/macos/src/marker_cleanup/process.rs \
            spikes/sandbox/macos/src/marker_cleanup/process_scan.rs \
            spikes/sandbox/macos/src/marker_cleanup/fixture.rs; do
            rustfmt +1.88.0 --edition 2024 --check "$source"
          done

      - name: Native compile gate
        shell: bash
        timeout-minutes: 5
        run: cargo +1.88.0 check --manifest-path spikes/sandbox/macos/Cargo.toml --all-targets --locked

      - name: Native lint gate
        shell: bash
        timeout-minutes: 5
        run: cargo +1.88.0 clippy --manifest-path spikes/sandbox/macos/Cargo.toml --all-targets --locked -- -D warnings

      - name: Marker cleanup fixture gate
        shell: bash
        timeout-minutes: 3
        run: bash spikes/sandbox/macos/ci/marker_cleanup_fixture.sh

      - name: Native security tests
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ja-sandbox-report"
          first_failure=0
          for round in 1 2 3; do
            set +e
            cargo +1.88.0 test --manifest-path spikes/sandbox/macos/Cargo.toml --all-targets --locked 2>&1 \
              | tee "$RUNNER_TEMP/ja-sandbox-report/test-${round}.log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            round_status="${pipeline_status[0]}"
            if [[ "$round_status" -eq 0 && "${pipeline_status[1]}" -ne 0 ]]; then
              round_status="${pipeline_status[1]}"
            fi
            if [[ "$round_status" -ne 0 && "$first_failure" -eq 0 ]]; then
              first_failure="$round_status"
            fi
          done
          exit "$first_failure"

      - name: Direct native probe
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo +1.88.0 build \
            --manifest-path spikes/sandbox/macos/Cargo.toml \
            --bin ja-sandbox-probe \
            --bin ja-sandbox-worker \
            --locked
          cargo +1.88.0 run --manifest-path spikes/sandbox/macos/Cargo.toml --bin ja-sandbox-probe --locked 2>&1 \
            | tee "$RUNNER_TEMP/ja-sandbox-report/probe.log"
          grep -F "SANDBOX-PASS" "$RUNNER_TEMP/ja-sandbox-report/probe.log"

      - name: Cleanup diagnostic helpers
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          private_root="$RUNNER_TEMP/ja-sandbox-private"
          report_dir="$RUNNER_TEMP/ja-sandbox-report"
          mkdir -p "$report_dir"
          cargo +1.88.0 run \
            --manifest-path spikes/sandbox/macos/Cargo.toml \
            --bin marker_cleanup \
            --locked \
            -- --root "$private_root" --report "$report_dir/helper-cleanup.log"

      - name: Process-table residual gate
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          private_root="$RUNNER_TEMP/ja-sandbox-private"
          report_dir="$RUNNER_TEMP/ja-sandbox-report"
          mkdir -p "$report_dir"
          cargo +1.88.0 run \
            --manifest-path spikes/sandbox/macos/Cargo.toml \
            --bin marker_cleanup \
            --locked \
            -- --residual-scan --root "$private_root" --report "$report_dir/process-table.log"

      - name: Residual process gate
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          private_root="$RUNNER_TEMP/ja-sandbox-private"
          cleanup_log="$RUNNER_TEMP/ja-sandbox-report/helper-cleanup.log"
          process_table_log="$RUNNER_TEMP/ja-sandbox-report/process-table.log"
          if [[ ! -f "$cleanup_log" ]]; then
            echo "JA sandbox diagnostic helper cleanup report is missing" >&2
            exit 1
          fi
          if grep -Eq "marker-(residual|invalid|incomplete|entry-invalid|group-unsafe|owner-mismatch|identity-lost|remove-failed|fallback-missing|pending|stat-invalid|root-invalid|process-probe-failed|signal-failed|eperm|query-unreaped|query-group-residual)=true" "$cleanup_log"; then
            echo "JA sandbox diagnostic helper cleanup evidence is unsafe or residual" >&2
            exit 1
          fi
          if [[ ! -f "$process_table_log" ]] || grep -Eq "process-table-(residual|query|output|scope|root|entry|evidence|parse|identity|failure|quarantine|report)=true" "$process_table_log"; then
            echo "JA sandbox process-table residual evidence is unsafe or unavailable" >&2
            exit 1
          fi
          shopt -s nullglob
          residual_scopes=("$private_root"/ja-sandbox-probe-scope-*.scope)
          if (( ${#residual_scopes[@]} > 0 )); then
            echo "JA sandbox process scope evidence remained after the residual scan" >&2
            exit 1
          fi
          residual_pending_scopes=("$private_root"/ja-sandbox-probe-scope-*.scope.pending-*)
          if (( ${#residual_pending_scopes[@]} > 0 )); then
            echo "JA sandbox pending process scope evidence remained after the residual scan" >&2
            exit 1
          fi
          residual_scope_failures=("$private_root"/ja-sandbox-probe-scope-*.scope.failure)
          if (( ${#residual_scope_failures[@]} > 0 )); then
            echo "JA sandbox persistent child-cleanup failure evidence remained" >&2
            exit 1
          fi
          residual_quarantine=("$private_root"/.ja-sandbox-probe-scope-quarantine*)
          if (( ${#residual_quarantine[@]} > 0 )); then
            echo "JA sandbox scope quarantine evidence remained after the residual scan" >&2
            exit 1
          fi
          residual_escape=("$private_root"/ja-sandbox-escape-*.evidence* "$private_root"/.ja-sandbox-escape-*-pending "$private_root"/.ja-sandbox-escape-*-restore)
          if (( ${#residual_escape[@]} > 0 )); then
            echo "JA sandbox setsid escape evidence remained after bounded cleanup" >&2
            exit 1
          fi
          residual_markers=("$private_root"/ja-sandbox-log-helper-*.marker "$private_root"/ja-sandbox-log-helper-*.fallback "$private_root"/ja-sandbox-log-helper-*.emergency "$private_root"/.ja-sandbox-log-helper-*.marker.pending "$private_root"/.ja-sandbox-log-helper-*.fallback.pending "$private_root"/.ja-sandbox-log-helper-*.emergency.pending)
          if (( ${#residual_markers[@]} > 0 )); then
            echo "JA sandbox marker residue detected" >&2
            exit 1
          fi
          cleaned_evidence=("$private_root"/.ja-sandbox-cleaned.* "$private_root"/.ja-sandbox-recovery.*)
          if (( ${#cleaned_evidence[@]} > 0 )); then
            echo "JA sandbox unresolved cleaned/recovery marker evidence remained after production cleanup" >&2
            exit 1
          fi

      - name: Upload bounded report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ja-sandbox-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/ja-sandbox-report
          if-no-files-found: ignore
          retention-days: 7
