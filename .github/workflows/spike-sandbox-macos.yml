name: macOS sandbox spike

on:
  workflow_dispatch:
  push:
    paths:
      - "spikes/sandbox/macos/**"
      - ".github/workflows/spike-sandbox-macos.yml"

permissions:
  contents: read

jobs:
  native-seatbelt:
    name: Seatbelt ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        shell: bash
        timeout-minutes: 3
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --no-self-update

      - name: Format gate
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cargo +1.88.0 metadata --manifest-path spikes/sandbox/macos/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          # cargo fmt has no --locked option; the locked metadata check above
          # verifies the manifest/lock contract before rustfmt runs.
          cargo +1.88.0 fmt --all --manifest-path spikes/sandbox/macos/Cargo.toml -- --check
          for source in \
            spikes/sandbox/macos/src/bin/probe.rs \
            spikes/sandbox/macos/src/bin/probe_unit_tests/mod.rs \
            spikes/sandbox/macos/src/bin/probe_lifecycle/mod.rs \
            spikes/sandbox/macos/src/bin/native/mod.rs \
            spikes/sandbox/macos/src/bin/native/setup.rs \
            spikes/sandbox/macos/src/bin/native/probes.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/mod.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/capture.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/evidence.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/lifecycle.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/marker.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/query.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/redaction.rs \
            spikes/sandbox/macos/src/bin/probe_diagnostics/tests.rs \
            spikes/sandbox/macos/src/bin/marker_cleanup.rs \
            spikes/sandbox/macos/src/marker_cleanup/mod.rs \
            spikes/sandbox/macos/src/marker_cleanup/marker.rs \
            spikes/sandbox/macos/src/marker_cleanup/process.rs \
            spikes/sandbox/macos/src/marker_cleanup/fixture.rs; do
            rustfmt +1.88.0 --edition 2024 --check "$source"
          done

      - name: Native compile gate
        shell: bash
        timeout-minutes: 5
        run: cargo +1.88.0 check --manifest-path spikes/sandbox/macos/Cargo.toml --all-targets --locked

      - name: Native lint gate
        shell: bash
        timeout-minutes: 5
        run: cargo +1.88.0 clippy --manifest-path spikes/sandbox/macos/Cargo.toml --all-targets --locked -- -D warnings

      - name: Marker cleanup fixture gate
        shell: bash
        timeout-minutes: 3
        run: bash spikes/sandbox/macos/ci/marker_cleanup_fixture.sh

      - name: Native security tests
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ja-sandbox-report"
          for round in 1 2 3; do
            cargo +1.88.0 test --manifest-path spikes/sandbox/macos/Cargo.toml --all-targets --locked 2>&1 \
              | tee "$RUNNER_TEMP/ja-sandbox-report/test-${round}.log"
          done

      - name: Direct native probe
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo +1.88.0 run --manifest-path spikes/sandbox/macos/Cargo.toml --bin ja-sandbox-probe --locked 2>&1 \
            | tee "$RUNNER_TEMP/ja-sandbox-report/probe.log"
          grep -F "SANDBOX-PASS" "$RUNNER_TEMP/ja-sandbox-report/probe.log"

      - name: Cleanup diagnostic helpers
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/ja-sandbox-report"
          mkdir -p "$report_dir"
          cargo +1.88.0 run \
            --manifest-path spikes/sandbox/macos/Cargo.toml \
            --bin marker_cleanup \
            --locked \
            -- --root "$RUNNER_TEMP" --report "$report_dir/helper-cleanup.log"

      - name: Residual process gate
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cleanup_log="$RUNNER_TEMP/ja-sandbox-report/helper-cleanup.log"
          if [[ -f "$cleanup_log" ]] && grep -Eq "marker-(residual|invalid|incomplete|entry-invalid|group-unsafe|owner-mismatch|remove-failed|fallback-missing|pending|stat-invalid|root-invalid|process-probe-failed|signal-failed|eperm|query-unreaped|query-group-residual)=true" "$cleanup_log"; then
            echo "JA sandbox diagnostic helper cleanup evidence is unsafe or residual" >&2
            exit 1
          fi
          shopt -s nullglob
          residual_markers=("$RUNNER_TEMP"/ja-sandbox-log-helper-*.marker "$RUNNER_TEMP"/ja-sandbox-log-helper-*.fallback "$RUNNER_TEMP"/ja-sandbox-log-helper-*.emergency "$RUNNER_TEMP"/.ja-sandbox-log-helper-*.marker.pending "$RUNNER_TEMP"/.ja-sandbox-log-helper-*.fallback.pending "$RUNNER_TEMP"/.ja-sandbox-log-helper-*.emergency.pending)
          if (( ${#residual_markers[@]} > 0 )); then
            echo "JA sandbox marker residue detected" >&2
            exit 1
          fi

      - name: Upload bounded report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ja-sandbox-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/ja-sandbox-report
          if-no-files-found: ignore
          retention-days: 7
